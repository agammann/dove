services:
  db:
    ports: !reset []
    restart: unless-stopped
  api:
    ports: !reset []
  caddy:
    image: caddy:2.10.2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOVE_DOMAIN: ${DOVE_DOMAIN:?Set the approved production hostname}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
