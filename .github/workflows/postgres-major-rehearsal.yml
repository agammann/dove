name: PostgreSQL major upgrade rehearsal
on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/test_postgres_major_upgrade.sh'
      - 'scripts/test_postgres18_guard.py'
      - 'scripts/confirm_postgres18_fresh.py'
      - 'deploy/postgres18-guard.sh'
      - 'deploy/postgres18-ready.sh'
      - 'compose.yaml'
      - 'compose.production.yaml'
      - 'compose.postgres18-init.yaml'
      - '.github/workflows/postgres-major-rehearsal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Rehearse synthetic PostgreSQL upgrade and rollback
        run: bash scripts/test_postgres_major_upgrade.sh
