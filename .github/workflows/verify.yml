name: Verify Dove

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pnpm: ['10.16.1', '11.25.0']
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.19.0'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ matrix.pnpm }}
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  python-native-compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install the shared hash-locked dependencies
        run: python -m pip install --require-hashes -r backend/requirements.txt
      - name: Check backend lint
        run: python -m ruff check backend
      - name: Verify focused Ruff exceptions
        run: python scripts/test_ruff_policy.py
      - name: Run synthetic SQLite tests under the documented native runtime
        working-directory: backend
        run: python -m pytest tests -q

  python-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Generate unique local database credentials
        run: |
          python3 -m unittest scripts/test_setup_env.py
          python3 -m unittest scripts/test_confirm_postgres18_fresh.py
          python3 scripts/setup_env.py
      - name: Validate actual resolved Compose preflight
        run: |
          docker compose -p dove -f compose.yaml config --format json | python3 -c 'import json,sys; from scripts.confirm_postgres18_fresh import validate_config; validate_config(json.load(sys.stdin), "local")'
          env ENVIRONMENT=production PUBLIC_URL=https://fixture.invalid DOVE_DOMAIN=fixture.invalid MODEL_ADAPTER=openai EMAIL_ADAPTER=resend SECRET_KEY=synthetic-secret-0123456789-0123456789-0123456789 OPENAI_API_KEY=synthetic RESEND_API_KEY=synthetic RESEND_WEBHOOK_SECRET=synthetic EMAIL_FROM=fixture@example.invalid REPLY_DOMAIN=reply.fixture.invalid docker compose -p dove -f compose.yaml -f compose.production.yaml config --format json | python3 -c 'import json,sys; from scripts.confirm_postgres18_fresh import validate_config; validate_config(json.load(sys.stdin), "production")'
      - name: Verify retained PostgreSQL credential rotation
        run: bash scripts/test_legacy_db_migration.sh
      - name: Exercise fresh PostgreSQL and object-store guards
        run: python scripts/test_postgres18_guard.py
      - name: Initialize the disposable PostgreSQL 18 sample
        env:
          DOVE_PG18_FRESH_INSTALL: confirmed-no-existing-dove-data
        run: docker compose -f compose.yaml -f compose.postgres18-init.yaml up --detach --wait --wait-timeout 180 db
      - name: Start documented Docker sample
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Verify SQLite and disposable PostgreSQL databases
        run: |
          docker compose run --rm --no-deps -T api python -m pytest tests -q
          docker compose exec -T db createdb -U dove dove_test
          docker compose run --rm --no-deps -T api sh -c 'TEST_DATABASE_URL="${DATABASE_URL%/*}/dove_test" python -m pytest tests -q'
      - name: Verify seeded application and isolated recovery
        run: |
          docker compose exec -T api python -m dove.cli seed
          curl --fail http://127.0.0.1:8000/api/health
          curl --fail http://127.0.0.1:8000/ > /tmp/dove-index.html
          test "$(docker compose exec -T api id -u)" = 10001
          docker compose exec -T -e DOVE_SYNTHETIC_BACKUP_FIXTURE=isolated-ci-only api python - < scripts/ci_seed_backup_fixture.py
          python scripts/backup.py --output /tmp/dove-backup
          result=$(python scripts/verify_restore.py /tmp/dove-backup)
          printf '%s\n' "$result"
          printf '%s' "$result" | python3 -c 'import json,sys; assert json.load(sys.stdin)["objects_verified"] >= 1'
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop disposable stack
        if: always()
        run: docker compose down --volumes

  browser-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sites
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sites/package-lock.json
      - run: npm ci
      - name: Record dependency audit
        id: dependency-audit
        continue-on-error: true
        run: |
          mkdir -p outputs
          npm audit --audit-level=low --json > outputs/dependency-audit.json
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify compiled browser workspace
        env:
          DOVE_TEST_CHANNEL: chromium
        run: |
          node scripts/preview-built.mjs > /tmp/dove-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" || true' EXIT
          for attempt in {1..60}; do
            if curl --silent --fail http://127.0.0.1:5174/workspace > /dev/null; then break; fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:5174/workspace > /dev/null
          node scripts/verify-browser.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: dove-browser-verification
          path: sites/outputs/
      - name: Require dependency audit success
        if: always()
        run: test '${{ steps.dependency-audit.outcome }}' = 'success'

  source-release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Package and verify exact source ZIP
        run: |
          node scripts/package-release.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/unpack-release.py --out ../dove-source-consumer
          exit $LASTEXITCODE
      - name: Install fresh source consumer
        working-directory: ../dove-source-consumer/sites
        run: npm ci
      - name: Check fresh source consumer
        working-directory: ../dove-source-consumer/sites
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx tsc --noEmit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          exit $LASTEXITCODE
      - name: Install measured native-test Chrome
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'dove-chrome.zip'
          $directory = Join-Path $env:RUNNER_TEMP 'dove-chrome'
          Invoke-WebRequest -Uri 'https://storage.googleapis.com/chrome-for-testing-public/155.0.8059.12/win64/chrome-win64.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $directory
          "DOVE_TEST_EXECUTABLE=$directory\chrome-win64\chrome.exe" >> $env:GITHUB_ENV
      - name: Verify ordinary and genuine native browser behavior
        working-directory: ../dove-source-consumer/sites
        run: |
          $preview = Start-Process -FilePath (Get-Command node).Source -ArgumentList 'scripts/preview-built.mjs' -WindowStyle Hidden -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP/dove-preview.log" -RedirectStandardError "$env:RUNNER_TEMP/dove-preview-error.log"
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              try { Invoke-WebRequest 'http://127.0.0.1:5174/workspace/' -UseBasicParsing | Out-Null; $ready = $true; break } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'Compiled consumer preview did not start.' }
            npm run test:browser
            if ($LASTEXITCODE -ne 0) { throw 'Ordinary browser verification failed.' }
            npm run test:native
            if ($LASTEXITCODE -ne 0) { throw 'Native browser verification failed.' }
          } finally {
            & taskkill /PID $preview.Id /T /F | Out-Null
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dove-release
          path: release-artifacts/
          if-no-files-found: error
      - name: Download the uploaded source archive
        id: archive-download-first
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dove-release
          path: ${{ runner.temp }}/dove-release-roundtrip
      - name: Wait for artifact visibility
        if: steps.archive-download-first.outcome == 'failure'
        run: Start-Sleep -Seconds 10
      - name: Retry source archive download
        id: archive-download-second
        if: steps.archive-download-first.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dove-release
          path: ${{ runner.temp }}/dove-release-roundtrip
      - name: Wait for artifact visibility again
        if: steps.archive-download-second.outcome == 'failure'
        run: Start-Sleep -Seconds 20
      - name: Final source archive download attempt
        if: steps.archive-download-second.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dove-release
          path: ${{ runner.temp }}/dove-release-roundtrip
      - name: Verify downloaded archive hash
        run: ./scripts/verify-roundtrip.ps1 -Directory (Join-Path $env:RUNNER_TEMP 'dove-release-roundtrip')
      - name: Reject a corrupted source archive
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'dove-release-corrupt-fixture'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $dir 'dove_1.0.0_source.zip') -Value 'fixture'
          Set-Content -LiteralPath (Join-Path $dir 'SHA256SUMS') -Value (('0' * 64) + '  dove_1.0.0_source.zip')
          try {
            ./scripts/verify-roundtrip.ps1 -Directory $dir
          } catch {
            if ($_.Exception.Message -notmatch 'hash mismatch') { throw }
            exit 0
          }
          throw 'Corrupt archive unexpectedly passed verification.'
      - name: Collect consumer verification inside the checkout
        if: always()
        run: |
          $outputs = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'dove-source-consumer/sites/outputs'
          if (Test-Path -LiteralPath $outputs) {
            New-Item -ItemType Directory -Path verification-artifacts -Force | Out-Null
            Copy-Item -LiteralPath $outputs -Destination verification-artifacts -Recurse
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: dove-source-consumer-verification
          path: verification-artifacts/

  publish:
    needs: [frontend-windows, python-native-compatibility, python-sample, browser-workspace, source-release]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dove-release
          path: release-artifacts/
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const {default: publish} = await import(process.env.GITHUB_WORKSPACE + '/scripts/release.mjs');
            await publish({github, context, core});

  retry-guard-test:
    name: Verify artifact failure guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Missing artifact attempt one
        id: first
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: intentionally-missing-artifact
      - name: Missing artifact attempt two
        id: second
        if: steps.first.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: intentionally-missing-artifact
      - name: Missing artifact attempt three
        id: third
        if: steps.second.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: intentionally-missing-artifact
      - name: Require all missing-artifact attempts to fail
        if: always()
        env:
          FIRST: ${{ steps.first.outcome }}
          SECOND: ${{ steps.second.outcome }}
          THIRD: ${{ steps.third.outcome }}
        run: test "$FIRST" = failure && test "$SECOND" = failure && test "$THIRD" = failure
